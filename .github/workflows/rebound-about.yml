name: Rebound.About

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/apps/Rebound.About/**'
      - '.github/workflows/rebound-about.yml'

jobs:
  package:
    name: Build MSIX Bundle
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Add CommunityToolkit Labs feed
        run: >
          dotnet nuget add source
          "https://pkgs.dev.azure.com/dotnet/CommunityToolkit/_packaging/CommunityToolkit-Labs/nuget/v3/index.json"
          --name CommunityToolkit-Labs

      - name: Generate signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=Ivirius Community" `
              -FriendlyName "Rebound CI Signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -KeyUsage DigitalSignature `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(1) `
              -TextExtension @(
                  "2.5.29.37={text}1.3.6.1.5.5.7.3.3"
                  "2.5.29.19={text}"
              )
          
          Export-Certificate `
              -Cert $cert `
              -FilePath "$env:GITHUB_WORKSPACE\ci-signing.cer"
          
          "CI_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build MSIX
        shell: cmd
        run: >
          msbuild src/apps/Rebound.About/Rebound.About.csproj
          -restore
          -t:Build
          -p:Configuration=Release
          -p:Platform=x64
          -p:AppxBundle=Always
          "-p:AppxBundlePlatforms=x64|ARM64"
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:GenerateAppxPackageOnBuild=true
          -p:GenerateAppInstallerFile=false
          -p:SolutionDir=%GITHUB_WORKSPACE%\
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateThumbprint=%CI_CERT_THUMBPRINT%
          -verbosity:minimal

      - name: Upload MSIX Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Rebound.About-MSIX
          path: src/apps/Rebound.About/AppPackages/**/*.msixbundle
          if-no-files-found: error
          retention-days: 14

      - name: Upload signing certificate
        uses: actions/upload-artifact@v4
        with:
          name: Rebound.About-Certificate
          path: ci-signing.cer
